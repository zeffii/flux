<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12161b; --line: #232a34; --text: #d5dbe4; --dim: #7c8794; --accent: #4fc3d9; --hot: #f06b7e;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden; }
  #app { display: grid; grid-template-rows: 40px 1fr; height: 100%; }

  header { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); user-select: none; }
  header .brand { font-weight: 700; letter-spacing: 0.14em; font-size: 12px; margin-right: 10px; color: var(--accent); }
  header button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 5px; height: 26px; padding: 0 10px; font: inherit; cursor: pointer; }
  header button:hover { border-color: #3a4452; background: #171c23; }
  header button.on { border-color: var(--accent); color: var(--accent); }
  header .time { font-family: var(--mono); color: var(--dim); min-width: 74px; text-align: right; }
  header .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  header .grow { flex: 1; }
  header .stats { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  main { display: grid; grid-template-columns: var(--split, 55%) 6px 1fr; min-height: 0; }
  #split { background: var(--line); cursor: col-resize; }
  #split:hover, #split.drag { background: var(--accent); }
  .pane { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
  .pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; z-index: 1; }
  .hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--dim); pointer-events: none; }

  .slider-edit { position: absolute; z-index: 5; background: #0e1116; color: var(--text); border: 1px solid var(--accent); border-radius: 4px; padding: 0 7px; font: 11px var(--mono); outline: none; }

  .code { position: absolute; top: 8px; right: 8px; bottom: 8px; width: min(46%, 560px); min-width: 300px; display: none; flex-direction: column; z-index: 0;
    background: transparent; border: 1px solid rgba(60, 72, 88, 0.3); border-radius: 8px; overflow: hidden; opacity: 0.38; pointer-events: none; transition: opacity 0.15s; }
  .code.front { z-index: 4; opacity: 1; pointer-events: auto; background: rgba(14, 17, 22, 0.94); border-color: #2f3846; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
  .code:not(.front) .code-head select, .code:not(.front) .code-head button { visibility: hidden; }
  .code.open { display: flex; }
  .code-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid rgba(60, 72, 88, 0.4); }
  .code-title { flex: 1; font-weight: 600; color: #e8d65a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .code-head select, .code-head button { background: #12161b; color: var(--text); border: 1px solid var(--line); border-radius: 5px; height: 24px; font: 12px var(--sans); cursor: pointer; }
  .code-head .code-run { border-color: #e8d65a; color: #e8d65a; padding: 0 8px; }
  .code-head .code-close { width: 24px; font-size: 15px; line-height: 1; }
  .code-body { flex: 1; display: flex; min-height: 0; font: 12.5px/1.55 var(--mono); }
  .code-gutter { margin: 0; padding: 10px 8px 10px 10px; color: #4a5462; text-align: right; overflow: hidden; user-select: none; min-width: 38px; font: inherit; }
  .code-gutter b { color: #fff; background: #a3283d; border-radius: 3px; padding: 0 3px; font-weight: 400; }
  .code-wrap { position: relative; flex: 1; min-width: 0; }
  .code textarea, .code-hl { position: absolute; inset: 0; margin: 0; padding: 10px 12px 10px 4px; border: 0; font: inherit; tab-size: 2; white-space: pre; letter-spacing: 0; }
  .code textarea { outline: none; resize: none; background: transparent; color: transparent; overflow: auto; caret-color: #e8d65a; }
  .code textarea::selection { background: rgba(120, 160, 230, 0.32); color: transparent; }
  .code-hl { overflow: hidden; color: #dfe6ee; pointer-events: none; padding-bottom: 60px; padding-right: 60px; }
  .code-band { position: absolute; left: 0; right: 0; top: 0; background: rgba(240, 86, 107, 0.13); border-left: 2px solid #f0566b; pointer-events: none; }
  .h-dim { color: #4f5966; } .h-comment { color: #5f6b7a; font-style: italic; } .h-label { color: #e8d65a; font-weight: 600; }
  .h-dir { color: #e8d65a; font-weight: 600; } .h-int { color: #c792ea; } .h-range { color: #6d7787; } .h-bad { color: #ff8a9a; text-decoration: underline wavy #f0566b; }
  .h-kw { color: #c792ea; } .h-num-lit { color: #f5b76a; } .h-str { color: #a5d68a; } .h-punc { color: #8a94a3; }
  .h-helper { color: #82d2e8; } .h-method { color: #9bb6ff; } .h-prop { color: #b8c4d4; }
  .h-num { color: #e0a84a; } .h-geo { color: #4fc3d9; } .h-kind { opacity: 0.75; }
  .h-out { font-weight: 700; } .h-decl.h-out { text-decoration: underline; text-underline-offset: 3px; }
  .code-foot { padding: 6px 10px; border-top: 1px solid rgba(60, 72, 88, 0.4); font: 11.5px/1.4 var(--mono); color: var(--dim); white-space: pre-wrap; max-height: 5.5em; overflow: auto; }
  .code-foot.bad { color: #ff8a9a; }

  #menu { position: fixed; z-index: 10; width: 240px; max-height: 70vh; display: none; flex-direction: column; background: #151a20; border: 1px solid #2f3846; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); overflow: hidden; }
  #menu.open { display: flex; }
  #menu input { margin: 8px; padding: 6px 8px; background: #0e1116; border: 1px solid var(--line); border-radius: 5px; color: var(--text); font: inherit; outline: none; }
  #menu input:focus { border-color: var(--accent); }
  #menu .list { overflow-y: auto; padding: 0 0 6px; }
  #menu .cat { padding: 6px 12px 3px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #menu .cat i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  #menu .item { padding: 4px 12px 4px 25px; cursor: pointer; }
  #menu .item.hot { background: #222a35; color: #fff; }
  #menu .empty { padding: 8px 12px; color: var(--dim); }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1b2129; border: 1px solid #2f3846; padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.show { opacity: 1; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: var(--split, 50%) 6px 1fr; }
    #split { cursor: row-resize; }
    header .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">FLUX</span>
    <button id="play" title="Play / pause (Space)">Pause</button>
    <button id="rewind" title="Back to zero">⏮</button>
    <span class="time" id="time">0.00 s</span>
    <span class="sep"></span>
    <button id="add" title="Add a node (Tab or right-click)">+ Node</button>
    <button id="fit" class="hide-sm" title="Fit the graph (F)">Fit</button>
    <span class="grow"></span>
    <span class="stats hide-sm" id="stats"></span>
    <span class="sep hide-sm"></span>
    <button id="new" title="Start from the demo graph">New</button>
    <button id="open" title="Open a .flux file">Open</button>
    <button id="save" title="Save a .flux file (Ctrl+S)">Save</button>
    <input type="file" id="file" accept=".flux,.json,application/json" hidden>
  </header>
  <main>
    <div class="pane"><canvas id="editor"></canvas><div class="hint">Tab: add node · drag a slider (Shift: fine) · double-click to type · Ctrl+Z / Ctrl+D / X</div></div>
    <div id="split"></div>
    <div class="pane"><canvas id="viewer"></canvas><div class="hint">drag: orbit · Shift / right-drag: pan · wheel: zoom · double-click: recentre</div></div>
  </main>
</div>
<div id="menu"><input placeholder="search nodes" spellcheck="false"><div class="list"></div></div>
<div id="toast"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
